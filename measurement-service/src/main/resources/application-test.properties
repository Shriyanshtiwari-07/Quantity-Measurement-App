# =============================================================
# Measurement Service - Test Profile
# Applied automatically when tests use @ActiveProfiles("test").
# Uses a separate H2 in-memory database for full test isolation.
# All values are hardcoded stubs - no external dependencies.
# =============================================================

spring.datasource.url=jdbc:h2:mem:measurement_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true

# Suppress excessive logging during test runs
logging.level.root=WARN
logging.level.com.app.measurementservice=INFO
logging.level.org.hibernate.SQL=WARN

springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT secret is a fixed test value. Safe to commit - test-only, never used in production.


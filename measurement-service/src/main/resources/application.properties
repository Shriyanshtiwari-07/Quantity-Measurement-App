# =============================================================
# Measurement Service - Base / Development Configuration
# Default active profile: prod
# To run in dev mode: --spring.profiles.active=dev
# To run tests:       --spring.profiles.active=test
#
# No .env file or spring-dotenv is used. Values are either:
#   - Hardcoded here (dev / non-sensitive defaults)
#   - Overridden by OS environment variables in prod (see application-prod.properties)
# =============================================================

spring.application.name=measurement-service
server.port=8081
spring.profiles.active=prod

# =============================================================
# H2 In-Memory Database (used by the dev and test profiles)
# Overridden by application-prod.properties for MySQL
# =============================================================
spring.datasource.url=jdbc:h2:mem:measurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================
# Spring Data JPA / Hibernate
# =============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
# H2 Console
# Access: http://localhost:8081/h2-console
# JDBC URL: jdbc:h2:mem:measurementdb  |  User: sa  |  Password: (blank)
# =============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================
# HikariCP Connection Pool
# =============================================================
spring.datasource.hikari.pool-name=MeasurementServicePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================
# Eureka
# =============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================================
# Logging
# =============================================================
logging.level.root=INFO
logging.level.com.app.measurementservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================
# Swagger / OpenAPI
# =============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =============================================================
# Spring Boot Actuator
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Measurement Service
info.app.version=1.0
info.app.description=Microservice for quantity measurement operations

# =============================================================
# =============================================================

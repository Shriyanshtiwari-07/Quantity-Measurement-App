# =============================================================
# Measurement Service - Production Profile
# Activate with: --spring.profiles.active=prod
#
# Required environment variables:
#   MEASUREMENT_DB_URL       jdbc:mysql://host:3306/measurement_db?useSSL=true&serverTimezone=UTC
#   MEASUREMENT_DB_USERNAME  your database username
#   MEASUREMENT_DB_PASSWORD  your database password
#                            MUST match the same secret used by user-service
# =============================================================

# MySQL datasource — measurement-service has its own database
spring.datasource.url=${MEASUREMENT_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Switch to 'validate' once the schema is stable in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console is never available in production
spring.h2.console.enabled=false

# Reduced log verbosity to minimise I/O overhead
logging.level.root=WARN
logging.level.com.app.measurementservice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Swagger UI disabled in production
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# =============================================================
# API Gateway - Single entry point for all client requests
# =============================================================

spring.application.name=api-gateway
server.port=8080

# =============================================================
# Spring Cloud Gateway — Route Definitions
# lb:// prefix tells the gateway to look up the service name
# in Eureka and load-balance the requests.
# =============================================================

# ---- Measurement Service routes ----
spring.cloud.gateway.routes[0].id=measurement-route
spring.cloud.gateway.routes[0].uri=lb://measurement-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/quantities/**

# ---- User / Auth Service routes ----
spring.cloud.gateway.routes[1].id=user-auth-route
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[2].id=user-route
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/users/**

# ---- OAuth2 routes (handled by user-service) ----
spring.cloud.gateway.routes[3].id=oauth2-route
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/oauth2/**,/login/oauth2/**

# =============================================================
# Global CORS configuration
# =============================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,X-Requested-With,Origin
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Default filters applied to all routes
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# =============================================================
# Eureka
# =============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================================
# Actuator
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# =============================================================
# Logging
# =============================================================
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.app.apigateway=DEBUG

# =============================================================
# JWT (same secret as user-service — gateway validates tokens centrally)
